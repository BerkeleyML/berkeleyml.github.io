{%- comment -%}
  Light/dark toggle, fixed in the top-right corner (this layout has no top bar). See head_custom.html.
{%- endcomment -%}
<button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
  <svg class="theme-toggle-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path fill="currentColor" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  <svg class="theme-toggle-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 1.5v2.5M12 20v2.5M1.5 12H4M20 12h2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></g></svg>
</button>
<script>
  (function () {
    var button = document.getElementById('theme-toggle');
    function update() {
      button.setAttribute('aria-pressed', window.siteTheme.get() === 'dark' ? 'true' : 'false');
    }
    button.addEventListener('click', function () {
      window.siteTheme.set(window.siteTheme.get() === 'dark' ? 'light' : 'dark');
    });
    document.addEventListener('site-theme-change', update);
    update();
  })();
</script>
